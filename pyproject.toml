[project]
name = "rag-security-pipeline"
version = "0.1.0"
description = "Automated Security Testing Pipeline for Large Language Models via RAG Data Poisoning"
requires-python = ">=3.10"
dependencies = [
    # Phase 1: core inference
    "numpy>=1.26",
    "ollama>=0.4",
    "pyyaml>=6.0",
    # Phase 2/3: vector DB + chunking
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "tiktoken>=0.7",
    # Defense classifier (PPL Filtering)
    # CPU-only install: pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.2",
    "transformers>=4.40",
    # CUAD corpus loading
    "datasets>=2.19",
    # Utilities
    "tqdm>=4.66",
    "pandas>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
